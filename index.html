<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Culebrilla</title>
<meta name="description" content="Culebrilla: eat fruit, chain superpowers, bite tails and rule 12 worlds.">
<link rel="icon" href="img/icon_192.png">
<link rel="stylesheet" href="fonts.css">
</head>
<body>
<style>
/* Layout: full-bleed game canvas under floating glass HUD; menus are illustrated full screens with candy buttons. Single dark look by design. */
:root{
  --ink:#0d0822; --glass:rgba(22,12,48,.62); --glassHi:rgba(255,255,255,.16);
  --pink:#ff3d8b; --pinkD:#b8195a; --amber:#ffb42e; --amberD:#c97606; --mint:#3ee6d0; --mintD:#0f9a8a;
  --sky:#6ec8ff; --text:#fff7ec; --muted:#d3c8ea; --danger:#ff4b5c; --outline:#2a0b2e;
  --display:'Lilita One','M PLUS Rounded 1c','Arial Rounded MT Bold',sans-serif;
  --body:'Nunito','M PLUS Rounded 1c',system-ui,sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-weight:800;font-size:15px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
img{max-width:100%;-webkit-user-drag:none}
.stroke{text-shadow:0 3px 0 var(--outline),2px 0 0 var(--outline),-2px 0 0 var(--outline),0 -2px 0 var(--outline),2px 2px 0 var(--outline),-2px 2px 0 var(--outline)}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}

/* candy buttons */
.candy{position:relative;font-family:var(--display);font-size:20px;letter-spacing:.02em;padding:13px 18px 15px;border-radius:18px;color:#fff;
  background:linear-gradient(180deg,#ffd56a 0%,var(--amber) 55%,#ff9a12 100%);border-bottom:5px solid var(--amberD);
  box-shadow:0 6px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.55);text-shadow:0 2px 0 rgba(120,50,0,.7);transition:transform .08s}
.candy::after{content:"";position:absolute;left:10px;right:10px;top:5px;height:36%;border-radius:12px;background:linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,0));pointer-events:none}
.candy:active{transform:translateY(3px);border-bottom-width:2px}
.candy.pink{background:linear-gradient(180deg,#ff7ab3 0%,var(--pink) 60%,#e8246f 100%);border-bottom-color:var(--pinkD);text-shadow:0 2px 0 rgba(110,0,40,.7)}
.candy.mint{background:linear-gradient(180deg,#8ff5e7 0%,var(--mint) 60%,#1fc8b2 100%);border-bottom-color:var(--mintD);text-shadow:0 2px 0 rgba(0,70,60,.7)}
.candy.dark{background:linear-gradient(180deg,#4a3a7a 0%,#2f2458 100%);border-bottom-color:#1a1236;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.round{width:52px;height:52px;padding:0;display:grid;place-items:center;border-radius:16px;flex:none}
.round svg{width:26px;height:26px;fill:#fff;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.glass{background:var(--glass);border:2px solid var(--glassHi);border-radius:22px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;z-index:4;display:grid;grid-template-columns:auto 1fr auto 1fr;align-items:center;gap:8px;
  padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-left:var(--gl);padding-right:var(--gr);pointer-events:none;font-variant-numeric:tabular-nums}
#hud>*{pointer-events:auto}
#btnPause{width:44px;height:44px;border-radius:14px}
#btnPause svg{width:20px;height:20px}
.pill{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;min-width:0;border-radius:999px;background:rgba(22,12,48,.82);border:2px solid var(--glassHi)}
/* over the moving game a backdrop blur is recomputed every frame (very costly on phones): use solid glass there */
#chain,#explain,#tut,#mi,#toast,#banner,#lb,#feed,#clipChip{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
#chain,#explain,#tut,#mi,#toast,#banner{background:rgba(22,12,48,.86)!important}
.pill.r{justify-self:end;padding:5px 5px 5px 12px;flex-direction:row-reverse}
.pill img{width:30px;height:30px;object-fit:contain}
.pill .pv{display:flex;flex-direction:column;line-height:1;min-width:0}
.pill.r .pv{align-items:flex-end}
.pv small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:900}
.pv b{font-family:var(--display);font-weight:400;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#8ff5e7,var(--mintD));font-family:var(--display);font-size:14px}
.pill.urgent{border-color:var(--danger);animation:pulse .6s infinite alternate}
@keyframes pulse{to{background:rgba(255,75,92,.35)}}
#hud .mid{display:flex;flex-direction:column;align-items:center;gap:5px}
#hHearts{height:16px;line-height:16px!important;overflow:visible}
#hHearts{font-size:15px;line-height:1;color:#ff4d7a;letter-spacing:1px;text-shadow:0 2px 0 #2a0b2e}
#hHearts:empty{display:none}
#perfMon{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 2px);z-index:30;padding:2px 8px;border-radius:8px;background:rgba(0,0,0,.72);color:#9dff9d;font:700 10px/1.3 monospace;pointer-events:none;white-space:nowrap}
#clipChip{position:fixed;right:calc(var(--gr) + 4px);top:calc(env(safe-area-inset-top,0px) + 70px);z-index:6;padding:7px 14px;border-radius:999px;background:linear-gradient(180deg,#ff5ab0,#c41e6a);border:2px solid #fff;color:#fff;font-family:var(--display);font-size:15px;box-shadow:0 4px 0 #2a0b2e,0 8px 24px rgba(255,61,139,.5);pointer-events:none;animation:clipIn 2.4s both}
@keyframes clipIn{0%{transform:translateX(130%)}12%{transform:translateX(-6%)}18%,85%{transform:none;opacity:1}100%{transform:translateX(20%);opacity:0}}
#resBody .kb{color:#ff9aae;margin-top:-6px}
#resClip{display:flex;gap:12px;align-items:center;justify-content:center;margin:6px 0 2px;padding:8px;border-radius:18px;background:rgba(255,61,139,.14);border:1.5px solid rgba(255,120,190,.5)}
#resClip video{width:70px;height:124px;border-radius:12px;object-fit:cover;background:#000;border:2px solid rgba(255,255,255,.4);flex:none}
#resClip .cl{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
#resClipL{font-family:var(--display);font-size:15px;color:#ffd23a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#resShare{font-size:16px;padding:10px 12px}
#resShare:disabled{opacity:.6}
#hHearts.hurt{animation:pop .4s}
#hCombo{font-family:var(--display);font-size:19px;padding:3px 12px 5px;border-radius:14px;color:#fff;background:linear-gradient(180deg,#ff7ab3,var(--pink));border-bottom:4px solid var(--pinkD);opacity:.3;transform:scale(.85);transition:opacity .15s,transform .15s}
#hCombo.hot{opacity:1;transform:scale(1)}
#hCombo.pop{animation:pop .3s}
@keyframes pop{40%{transform:scale(1.35) rotate(-6deg)}}

#banner{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:min(86vw,360px);padding:66px 20px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;pointer-events:none}
#banner .bn-img{position:absolute;left:50%;top:-62px;width:120px;transform:translateX(-50%);filter:drop-shadow(0 8px 12px rgba(0,0,0,.4));animation:bob 2s ease-in-out infinite}
#banner .bn-k{font-family:var(--display);font-size:16px;color:var(--amber);letter-spacing:.04em}
#banner .bn-t{font-family:var(--display);font-size:26px;line-height:1.15;text-wrap:balance}
#banner .bn-m{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.chip{font-size:12px;font-weight:900;padding:4px 10px;border-radius:999px;background:rgba(110,200,255,.2);border:1.5px solid var(--sky);color:#dff3ff}
#banner .bn-r{font-family:var(--display);color:var(--mint);font-size:17px;animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
@keyframes bob{50%{transform:translateX(-50%) translateY(-8px)}}

#pad{position:fixed;left:0;right:0;bottom:0;z-index:4;display:grid;grid-template-columns:repeat(3,74px);grid-template-rows:repeat(2,66px);gap:10px;justify-content:center;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding-left:var(--gl);padding-right:var(--gr)}
#pad button{font-size:26px;padding:0}
#pad .u{grid-column:2;grid-row:1}#pad .l{grid-column:1;grid-row:2}#pad .d{grid-column:2;grid-row:2}#pad .r{grid-column:3;grid-row:2}
#joy{position:fixed;z-index:3;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid rgba(255,255,255,.5);background:radial-gradient(rgba(255,255,255,.12),rgba(255,255,255,.03));pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:linear-gradient(180deg,#ffd56a,var(--amber));border-bottom:4px solid var(--amberD)}

/* Screens */
.screen{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;overflow-y:auto;
  padding-left:var(--gl);padding-right:var(--gr);padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 16px)}
.wrap{width:100%;max-width:460px;display:flex;flex-direction:column;gap:12px;margin-block:auto}
.illus{background-size:cover;background-position:center}
#sMenu{background-image:linear-gradient(180deg,rgba(13,8,34,.1) 0%,rgba(13,8,34,0) 26%,rgba(13,8,34,.55) 52%,rgba(13,8,34,.92) 100%),url(img/menu_bg.jpg)}
#sLoad{background:radial-gradient(circle at 50% 40%,#2a1660,var(--ink));justify-content:center;gap:24px;z-index:9}
#sLoad img{width:min(80vw,380px)}
.bar{width:min(70vw,280px);height:16px;border-radius:999px;background:rgba(255,255,255,.1);border:2px solid var(--glassHi);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--amber));border-radius:999px;transition:width .2s}
.logo{width:min(56vw,240px);align-self:center;margin-top:2px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45));animation:logoIn .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes logoIn{from{transform:scale(.6) translateY(-20px);opacity:0}}
.modes{display:flex;flex-direction:column;gap:10px}
.mode{position:relative;min-height:74px;border-radius:22px;overflow:hidden;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;padding:10px 16px;
  border:3px solid rgba(255,255,255,.9);box-shadow:0 7px 0 rgba(0,0,0,.35),0 14px 30px rgba(0,0,0,.35);transition:transform .1s;animation:rise .5s both}
.mode:nth-child(2){animation-delay:.07s}.mode:nth-child(3){animation-delay:.14s}
@keyframes rise{from{transform:translateY(30px);opacity:0}}
.mode::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,8,34,.82) 0%,rgba(13,8,34,.35) 55%,rgba(13,8,34,0) 100%)}
.mode>*{position:relative}
.mode:active{transform:scale(.97) translateY(3px)}
.mode .mt{font-family:var(--display);font-size:26px;line-height:1}
.mode .md{font-size:12px;color:#f1e8ff;max-width:62%}
.mode .mc{position:absolute;top:9px;right:12px;font-family:var(--display);font-size:14px;padding:4px 10px;border-radius:999px;background:rgba(13,8,34,.7);color:var(--amber);font-variant-numeric:tabular-nums}
.mode .mc:empty{display:none}
.mode.m1{background:url(img/mode_classic.jpg) center/cover}
.mode.m2{background:url(img/mode_adv.jpg) center/cover}
.mode.m3{background:url(img/mode_battle.jpg) center/cover}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#hud .pill{justify-self:start}
#hud .pill.r{justify-self:end}
/* computers and landscape web portals: two-column menu, compact results, everything above the fold */
@media (orientation:landscape) and (max-height:820px) and (min-width:600px){
  #sMenu .wrap{max-width:min(980px,96vw);display:grid;grid-template-columns:1fr 1.15fr;column-gap:24px;row-gap:8px;align-content:center;margin-block:auto!important;flex:none!important}
  #sMenu .topbar{grid-column:1/-1;grid-row:1}
  #sMenu .logo{grid-column:1;grid-row:2;width:min(30vw,250px)}
  #sMenu .quick{grid-column:1;grid-row:3}
  #sMenu .chests{grid-column:1;grid-row:4}
  #sMenu .wrap>div[style]{display:none}
  #sMenu .modes{grid-column:2;grid-row:2/5;align-self:center}
  #sMenu .tiles{grid-column:2;grid-row:5}
  #sMenu .menu-foot{grid-column:1;grid-row:5;align-self:end}
  #sMenu .foot{grid-column:1/-1;grid-row:6}
  #sResult .card{padding-top:18px;margin-top:8px}
  #sResult .card .mascot{display:none}
  #sResult .qms,#sResult .goal{display:none}
}
@media (orientation:landscape) and (max-height:520px) and (min-width:600px){
  #sMenu .logo{width:min(26vw,170px)}
  #sMenu .mode{min-height:62px;padding:7px 14px}
  #sMenu .mode .mt{font-size:22px}
  #sMenu .tile{height:62px}
  #sMenu .chests .chest{min-height:0}
}
@media (orientation:landscape) and (max-height:600px) and (min-width:600px){
  .screen .card{padding-top:16px;margin-top:6px}
  .screen .card .mascot{display:none}
}
@media (orientation:landscape) and (max-height:520px) and (min-width:600px){
  #sResult .card{gap:6px;padding:12px 16px;margin-block:4px}
  #sResult .result .rt{font-size:24px}
  #sResult .result .rb{font-size:44px}
  #sResult .result .rs{font-size:34px}
  #sResult .xprow{display:none}
  #sResult .candy{padding-top:8px;padding-bottom:10px}
  #sResult .chestwon svg{width:28px;height:28px}
}
.tile{position:relative;height:76px;border-radius:20px;overflow:hidden;display:flex;align-items:flex-end;padding:8px 12px;text-align:left;border:3px solid rgba(255,255,255,.85);box-shadow:0 6px 0 rgba(0,0,0,.3);background-size:cover;background-position:center}
.tile::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(13,8,34,.85),rgba(13,8,34,.1) 70%)}
.tile:active{transform:translateY(3px)}
.tile span{position:relative;font-family:var(--display);font-size:17px;line-height:1.05}
.tile span small{display:block;font-family:var(--body);font-size:11px;color:var(--muted)}
.tile img{position:absolute;right:2px;bottom:-4px;height:84px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.tile.sk{background:linear-gradient(135deg,#5a2a8a,#2a1660)}
.menu-foot{display:flex;gap:10px;align-items:center}
.menu-foot .candy.wide{flex:1;font-size:18px}
.foot{color:var(--muted);font-size:12px;text-align:center}

.head{display:flex;align-items:center;gap:12px}
.head h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0;flex:1;text-wrap:balance}
html[lang=ja] .head h2{font-size:23px;white-space:nowrap}
html[lang=ja] .mode .mt{font-size:21px;line-height:1.3}
html[lang=ja] .qb{font-size:11px}
.head .sum{font-family:var(--display);font-size:18px;color:var(--amber);font-variant-numeric:tabular-nums}
#sLevels{background-image:linear-gradient(rgba(13,8,34,.55),rgba(13,8,34,.85)),url(img/mode_adv.jpg)}
#sSettings,#sAchievs,#sSkins,#sScenes{background-image:linear-gradient(rgba(13,8,34,.7),rgba(13,8,34,.9)),url(img/menu_bg.jpg)}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;padding:12px}
.lv{position:relative;overflow:hidden;aspect-ratio:1;max-width:100%;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:var(--display);font-size:22px;
  background:linear-gradient(180deg,#5b4a96,#33276a);border-bottom:4px solid #1c1440;box-shadow:inset 0 2px 0 rgba(255,255,255,.25)}
.lv>img{position:absolute;right:-6px;bottom:-6px;width:58%;opacity:.55;pointer-events:none}
.lv>span,.lv>small{position:relative}
.lv small{font-family:var(--body);font-size:10px;color:var(--amber);line-height:1}
.lv.done{background:linear-gradient(180deg,#ff8fbf,var(--pink));border-bottom-color:var(--pinkD)}
.lv.next{background:linear-gradient(180deg,#ffd56a,var(--amber));border-bottom-color:var(--amberD);animation:glow 1s infinite alternate}
@keyframes glow{to{box-shadow:0 0 18px 4px rgba(255,180,46,.7),inset 0 2px 0 rgba(255,255,255,.4)}}
.lv.lock{opacity:.45;cursor:not-allowed}
.lv .moon{position:absolute;top:5px;left:7px;width:9px;height:9px;border-radius:50%;box-shadow:-2px 1px 0 0 #bcd6ff}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.skin{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px 10px;border-radius:20px;background:linear-gradient(180deg,#4a3a7a,#2a1f52);border:3px solid rgba(255,255,255,.18);border-bottom-width:5px}
.skin img{width:100%;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 5px 6px rgba(0,0,0,.4))}
.skin b{font-family:var(--display);font-weight:400;font-size:17px}
.skin small{font-size:10px;color:var(--muted);text-align:center;line-height:1.2;min-height:24px}
.skin.on{border-color:var(--mint);background:linear-gradient(180deg,#2c7a84,#16405a)}
.skin.on small{color:var(--mint)}
.skin.lock>img{filter:brightness(0) opacity(.45)}
.skin.lock{cursor:not-allowed}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scn{position:relative;height:118px;border-radius:20px;overflow:hidden;background-size:cover;background-position:center;border:3px solid rgba(255,255,255,.4);border-bottom-width:5px;display:flex;align-items:flex-end;padding:8px 10px;text-align:left}
.scn::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(13,8,34,.85),rgba(13,8,34,0) 60%)}
.scn img{position:absolute;width:44%;top:6px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
.scn img.a{left:4px}.scn img.b{right:4px;top:22px;width:38%}
.scn span{position:relative;font-family:var(--display);font-size:16px;line-height:1.05}
.scn.on{border-color:var(--mint);box-shadow:0 0 0 3px rgba(62,230,208,.35)}
.scn.on::after{content:"✓";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;background:var(--mint);color:#053b35;display:grid;place-items:center;font-family:var(--display)}

.group{display:flex;flex-direction:column;gap:10px;padding:16px}
.gl{font-family:var(--display);font-size:18px;display:flex;justify-content:space-between;align-items:center}
.gl span:last-child{color:var(--amber);font-variant-numeric:tabular-nums}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 auto;min-width:68px;padding:10px 10px 12px;border-radius:14px;font-weight:900;font-size:14px;background:linear-gradient(180deg,#4a3a7a,#2f2458);border-bottom:4px solid #1a1236}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,#8ff5e7,var(--mint));border-bottom-color:var(--mintD);color:#053b35}
.seg button:active{transform:translateY(2px)}
input[type=range]{width:100%;height:28px;accent-color:var(--pink)}

.ach{display:grid;grid-template-columns:48px 1fr;gap:14px;align-items:center;padding:12px 14px}
.ach .ai{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:#2f2458;font-family:var(--display);font-size:22px;color:#7a6aa8}
.ach.on .ai{background:linear-gradient(180deg,#ffd56a,var(--amber));color:#fff;border-bottom:3px solid var(--amberD)}
.ach b{display:block;font-family:var(--display);font-weight:400;font-size:18px}
.ach span{color:var(--muted);font-size:13px}
.ach:not(.on){opacity:.7}

#sPause,#sResult{background:rgba(13,8,34,.72)}
.card{position:relative;padding:74px 20px 20px;display:flex;flex-direction:column;gap:12px;margin-top:64px}
@media (max-height:720px){.card{padding-top:56px;margin-top:46px;gap:9px}.card .mascot{width:112px!important;top:-60px!important}}
.card .mascot{position:absolute;left:50%;top:-78px;width:146px;transform:translateX(-50%);filter:drop-shadow(0 10px 14px rgba(0,0,0,.45));animation:bob 2.2s ease-in-out infinite}
.result{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.result .rt{font-family:var(--display);font-size:34px;line-height:1.05;text-wrap:balance}
.result .rb{font-family:var(--display);font-size:72px;line-height:1;color:#fff;animation:pop .5s .15s both}
.result .rs{display:flex;gap:6px;font-size:52px;line-height:1}

/* spatial hashing for bodies and food */
const CELL = 72;
const gkey = (gx, gy) => (gx + 512)*4096 + (gy + 512);

/* food */
function addFood(type, x, y, extra={}){

  else if (type === 'gold') f.val = .6;
  else if (type === 'ice') f.val = .15;
  else if (type === 'pow') f.val = 0;

}
function spawnRandomFood(){

function genLevel(L){
  const type = L === 1 ? 'eat' : ['eat','eatT','ice','score','surv'][(L-1)%5];
  const night = L%7 === 0 || (L > 30 && L%4 === 0);
  const fast = L%6 === 0 || L > 40;
  const n = type === 'ice' ? 5 + Math.floor(L/5) : 10 + Math.floor(L*.6);
  const time = type === 'surv' ? 30 + Math.floor(L*.7) : Math.max(35, 55 + Math.floor(L*.8) - (fast?6:0));
  const goalScore = 200 + L*25;
  const g = {L, type, night, fast, walls: L >= 4, n, time, goalScore, scene:sceneOfLevel(L), rivals: L < 6 ? 3 : L < 20 ? 5 : 7, props: L < 4 ? 8 : 18 + Math.floor(L*.9)};
  g.text = type==='eat' ? t('o_eat',{n}) : type==='eatT' ? t('o_eatT',{n,t:time}) : type==='ice' ? t('o_ice',{n,t:time}) : type==='score' ? t('o_score',{n:goalScore}) : t('o_surv',{t:time});
  g.timed = type==='eatT' || type==='ice' || type==='surv';
  g.par = type==='eat' ? n*3 : type==='score' ? Math.round(goalScore/14) : time;
  return g;
}

function danger(s, x, y, rad){

  let d = 0;
  forNear(G.segGrid, x, y, rad + 30, it => { if (it.s !== s && !(it.s.me && G.time < G.ghostUntil)) { const dx = it.x - x, dy = it.y - y, rr = rad + it.s.r; if (dx*dx + dy*dy < rr*rr) { d = 1; return false; } } });

}
function aiThink(s){

  else if (!s.goal || G.time > s.goalT || (s.goal.f && s.goal.f.dead)) {
    s.goal = null; let best = 0;
    forNear(G.foodGrid, h.x, h.y, 420, f => { if (f.dead) return; const d = Math.hypot(f.x - h.x, f.y - h.y) + 30, v = (f.type === 'gold' ? 6 : f.type === 'pow' ? 2 : f.val || .5)/d; if (v > best) { best = v; s.goal = {f}; } });
    if (P && P.alive && !G.tut && G.time > 8 && G.time > G.ghostUntil && s.mass > P.mass*1.15 && R() < s.aggr) {
      const ph = P.pts[0], dd = Math.hypot(ph.x - h.x, ph.y - h.y);
      if (dd < 520) s.goal = {x: ph.x + Math.cos(P.ang)*(120 + P.r*4), y: ph.y + Math.sin(P.ang)*(120 + P.r*4), hunt:true};
    }
    s.goalT = G.time + .6 + R()*.8;
  }
  let want = s.ang + Math.sin(G.time*.7 + s.wobble)*.6;
  if (s.goal) { const gx = s.goal.f ? s.goal.f.x : s.goal.x, gy = s.goal.f ? s.goal.f.y : s.goal.y; want = Math.atan2(gy - h.y, gx - h.x); }
  if (G.world.zoneR) { const dx = G.world.cx - h.x, dy = G.world.cy - h.y; if (Math.hypot(dx, dy) > G.world.zoneR - 260) want = Math.atan2(dy, dx); }
  const look = s.r*3 + 70;
  let bestA = want, bestS = -1e9;
  for (const off of [0, -.45, .45, -.9, .9, -1.4, 1.4, -2.1, 2.1]) {
    const a = s.ang + off;
    let sc = -Math.abs(angDiff(a, want))*2 - Math.abs(off)*.3;
    const d1 = danger(s, h.x + Math.cos(a)*look*.5, h.y + Math.sin(a)*look*.5, s.r*.9);
    const d2 = danger(s, h.x + Math.cos(a)*look, h.y + Math.sin(a)*look, s.r*.9);
    sc -= d1*60 + d2*25;
    if (sc > bestS) { bestS = sc; bestA = a; }
  }
  s.tAng = bestA;
  s.boost = (s.goal && (s.goal.hunt || (s.goal.f && s.goal.f.type === 'gold'))) && s.mass > 5 && bestS > -20 && R() < .6;
}
function assist(s){

  const ahead = danger(s, h.x + Math.cos(s.ang)*look, h.y + Math.sin(s.ang)*look, s.r*.8);
  if (G.time < G.assistUntil) { s.tAng = G.assistAng; return; }
  if (!ahead || G.time < G.assistReady) return;
  let best = null, bs = 1e9;
  for (const off of [-.7, .7, -1.3, 1.3, -2, 2]) {
    const a = s.ang + off, d = danger(s, h.x + Math.cos(a)*look, h.y + Math.sin(a)*look, s.r*.8)*10 + Math.abs(off);
    if (d < bs) { bs = d; best = a; }
  }
  if (best != null && bs < 10) { G.assistAng = best; G.assistUntil = G.time + .32; G.assistReady = G.time + .9; s.tAng = best; }
}
function moveSnake(s, dt){
  if (frozen(s)) return;
  const slow = G.time < s.slowUntil ? .55 : 1;
  const canBoost = s.boost && s.mass > 3.2;
  const sp = (canBoost ? BOOST : SPD) * slow * (G.mode === 'adventure' && G.lv.fast && !s.me ? 1.12 : 1) * (s.me && G.time < (G.frenzyUntil||0) ? 1.15 : 1) * (s.boss ? .92 : 1) * (s.me && powerOn('bolt') ? 1.55 : s.me && powerOn('rainbow') ? 1.35 : 1);
  const turn = (s.me ? 6.2 : 4.4) * Math.pow(BASE_R/s.r, .3) * dt;
  s.ang += Math.max(-turn, Math.min(turn, angDiff(s.ang, s.tAng)));
  const p = s.pts, h = p[0];
  h.x += Math.cos(s.ang)*sp*dt; h.y += Math.sin(s.ang)*sp*dt;
  s.r += (radiusOf(s.mass) - s.r)*Math.min(1, dt*2);
  const gap = s.r*.5;
  for (let i = 1; i < p.length; i++) {
    const a = p[i-1], b = p[i], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
    if (d > gap) { const k = gap/d; b.x = a.x + dx*k; b.y = a.y + dy*k; }
  }

  while (p.length < n) { const l = p[p.length-1]; p.push({x:l.x, y:l.y}); }
  while (p.length > n && p.length > 4) p.pop();

    if (s.me && G.mission && G.mission.k === 'boost') missionProg(dt);
  }
  s.travel = (s.travel || 0) + sp*dt;
}

    }

/* ================= Meta progression: gold, levels, shop, daily reward, challenges, lucky wheel ================= */
const PRICES = [0,0,700,1100,1700,2500,3500,4800,6200,8000,10500,14000];
const DAILY = [15,20,30,40,55,70,150];
const dayNum = () => Math.floor((Date.now() - new Date().getTimezoneOffset()*60000)/86400000);
const xpNeed = l => 250 + l*180;
const QPOOL = {loop:[[1,35],[3,55],[5,80]], power:[[3,30],[6,45],[9,70]], bite:[[5,30],[10,45],[16,70]], eat:[[40,25],[70,40],[110,60]], kill:[[3,35],[6,55],[10,80]], size:[[22,30],[32,50],[45,75]], score:[[6000,30],[12000,50],[25000,75]], play:[[4,20],[7,35],[10,50]], gold:[[3,30],[5,45],[8,70]], mission:[[3,30],[5,45],[8,70]]};
const QICON = {loop:'◯', power:'✦', bite:'✂', eat:'<img src="img/f_apple.webp" alt="">', gold:'<img src="img/f_gold.webp" alt="">', kill:'⚔', size:'↔', score:'★', play:'▶', mission:'◎'};
function metaInit(){
  if (save.coins == null) save.coins = 0;
  if (save.xp == null) save.xp = 0;
  if (save.lvl == null) save.lvl = 1;
  if (!Array.isArray(save.owned)) save.owned = SKINS.map((s,i) => (i < 2 || save.stats.apples >= s.need) ? i : -1).filter(i => i >= 0);
  if (!save.owned.includes(save.skin)) save.skin = 0;
  save.daily = save.daily || {last:-1, streak:0};
  save.wheel = save.wheel || {day:-1, extra:0};
  save.quests = save.quests || {day:-1, list:[], bonus:false};
  save.stats.games = save.stats.games || 0;

}
function rollQuests(){
  const d = dayNum(); if (save.quests.day === d && save.quests.list.length) return;
  const keys = Object.keys(QPOOL).sort(() => Math.random() - .5).slice(0, 3), tier = Math.min(2, Math.floor((save.lvl - 1)/4));
  save.quests = {day:d, bonus:false, list: keys.map((k,i) => { const tr = Math.max(0, Math.min(2, tier + (i === 2 ? 1 : 0) - (i === 0 ? 1 : 0))), [n, r] = QPOOL[k][tr]; return {k, n, r, prog:0, done:false, claimed:false}; })};

}
const qText = q => t(q.n === 1 && q.k === 'loop' ? 'q_loop1' : 'q_'+q.k, {n:q.n});
function qAdd(k, v, best){
  rollQuests();

    q.prog = best ? Math.max(q.prog, v) : q.prog + v;
    if (q.prog >= q.n) { q.prog = q.n; q.done = true; if (G.state === 'play') { feed(t('questDone') + ' · ' + qText(q), '#3ee6d0'); Snd.play('win'); buzz([15,30,15]); } }

}
const dailyReady = () => save.daily.last !== dayNum();
const wheelReady = () => save.wheel.day !== dayNum() || save.wheel.extra > 0;

/* ---------- lucky wheel ---------- */
const WHEEL = [{g:10,w:30},{skin:1,w:1},{g:25,w:20},{g:5,w:28},{g:60,w:6},{xp:80,w:12},{g:15,w:22},{g:200,w:1}];
const WCOL = ['#ff3d8b','#ffb42e','#7a5ad6','#1fc8b2'];
let wheelRot = 0, wheelBusy = false, wSkin = -1;
function wtxt(c, s, x, y, sz){ c.font = `400 ${sz}px 'Lilita One',sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round'; c.lineWidth = sz*.22; c.strokeStyle = '#2a0b2e'; c.strokeText(s, x, y); c.fillStyle = '#fff'; c.fillText(s, x, y); }
function drawWheel(){
  const cvw = $('#wheelCv'), c = cvw.getContext('2d'), W2 = cvw.width, R0 = W2/2 - 22, n = WHEEL.length, seg = TAU/n;
  c.clearRect(0, 0, W2, W2); c.save(); c.translate(W2/2, W2/2);
  c.fillStyle = '#2a0b2e'; c.beginPath(); c.arc(0, 0, R0 + 20, 0, TAU); c.fill();
  c.fillStyle = '#ffd23a'; c.beginPath(); c.arc(0, 0, R0 + 12, 0, TAU); c.fill();
  for (let i = 0; i < 16; i++) { const a = i*TAU/16 + wheelRot*.0; c.fillStyle = i % 2 ? '#fff6c0' : '#ff7ab3'; c.beginPath(); c.arc(Math.cos(a)*(R0 + 6), Math.sin(a)*(R0 + 6), 6, 0, TAU); c.fill(); }
  c.rotate(wheelRot);
  for (let i = 0; i < n; i++) {
    const a0 = -Math.PI/2 - seg/2 + i*seg;
    const g = c.createRadialGradient(0, 0, R0*.2, 0, 0, R0); g.addColorStop(0, WCOL[i % 4]); g.addColorStop(1, css(shadeA(rgb(WCOL[i % 4]), .8)));
    c.fillStyle = g; c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, R0, a0, a0 + seg); c.closePath(); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 4; c.stroke();
    c.save(); c.rotate(a0 + seg/2 + Math.PI/2);
    const it = WHEEL[i];
    if (it.g) { if (IMG.gold) c.drawImage(IMG.gold, -30, -R0*.9, 60, 60); wtxt(c, it.g, 0, -R0*.9 + 96, 46); }
    else if (it.xp) { wtxt(c, '+' + it.xp, 0, -R0*.74, 44); wtxt(c, 'XP', 0, -R0*.74 + 48, 38); }
    else { const im = wSkin >= 0 ? IMG['skin'+(wSkin+1)] : IMG.gold; if (im) c.drawImage(im, -55, -R0*.95, 110, 110); wtxt(c, wSkin >= 0 ? '!' : '300', 0, -R0*.95 + 136, 40); }
    c.restore();
  }
  c.restore();
  c.fillStyle = '#2a0b2e'; c.beginPath(); c.arc(W2/2, W2/2, 54, 0, TAU); c.fill();
  const hg = c.createRadialGradient(W2/2 - 12, W2/2 - 12, 4, W2/2, W2/2, 46); hg.addColorStop(0, '#fff6c0'); hg.addColorStop(1, '#ffb42e');
  c.fillStyle = hg; c.beginPath(); c.arc(W2/2, W2/2, 46, 0, TAU); c.fill();
}
function buildWheel(){
  const locked = SKINS.map((_,i) => i).filter(i => !save.owned.includes(i));
  if (!wheelBusy) wSkin = locked.length ? locked[(R()*locked.length)|0] : -1;
  drawWheel(); wheelInfo();
}
function wheelInfo(){
  const b = $('#wSpin');
  b.disabled = wheelBusy || !wheelReady(); b.textContent = wheelReady() ? t('spin') : t('spinNone');
  $('#wInfo').textContent = save.wheel.extra > 0 ? t('spinExtra', {n:save.wheel.extra}) : '';

function spinWheel(){
  if (wheelBusy || !wheelReady()) return;
  Snd.init();
  if (save.wheel.day !== dayNum()) save.wheel.day = dayNum(); else save.wheel.extra--;
  persist();
  const tot = WHEEL.reduce((a,b) => a + b.w, 0); let r = R()*tot, idx = 0;
  for (; idx < WHEEL.length - 1; idx++) { r -= WHEEL[idx].w; if (r <= 0) break; }
  const seg = TAU/WHEEL.length, cur = wheelRot, desired = -idx*seg + (R() - .5)*seg*.6;
  const end = cur + ((((desired - cur) % TAU) + TAU) % TAU) + TAU*6, t0 = performance.now(), dur = 4600;
  wheelBusy = true; wheelInfo();

  const step = now => {
    const k = Math.min(1, (now - t0)/dur), e = 1 - Math.pow(1 - k, 4);
    wheelRot = cur + (end - cur)*e; drawWheel();

/* ================= Signature mechanics: fruit chains → superpowers, tail biting, in-run evolution ================= */
// Fruit colour families. Eating 3 of the same family in a row unleashes that family's superpower.
const FAM = {apple:'fire', cherry:'fire', strawberry:'fire', pomegranate:'fire', dragon:'fire',
             banana:'bolt', pineapple:'bolt', lemon:'bolt', mango:'bolt',
             grapes:'ghost', blueberry:'ghost', plum:'ghost',
             watermelon:'giant', pear:'giant', kiwi:'giant',
             orange:'bomb', peach:'bomb', coconut:'bomb'};

const FAMFR = {}; FRUITS.forEach((f,i) => { (FAMFR[FAM[f.k]] = FAMFR[FAM[f.k]] || []).push(i); });

function chainEat(f){
  const fam = FAM[FRUITS[f.v].k], ch = G.chain;
  G.rb = G.rb || [];
  if (G.rb.includes(fam)) G.rb = [fam]; else G.rb.push(fam);
  if (G.rb.length >= 5) { G.rb = []; ch.fam = null; ch.list = []; activatePower('rainbow'); return; }
  if (ch.fam === fam) ch.list.push(f.v); else { ch.fam = fam; ch.list = [f.v]; }
  if (ch.list.length >= 3) { activatePower(fam); ch.fam = null; ch.list = []; }
  else if (ch.list.length === 2) Snd.play('chain');
  drawChain();
}
function activatePower(k){
  const firstTime = explainOnce(k);
  const P = G.player, h = P.pts[0];
  G.powersUsed = (G.powersUsed||0) + 1; qAdd('power', 1);
  if (!firstTime) feed(t('pw_'+k), FAMCOL[k]); Snd.play('power'); buzz([30,20,30,20,60]); G.shake = Math.max(G.shake, 8); G.flash = .3; G.flashCol = FAMCOL[k];
  burst(h.x, h.y, FAMCOL[k], 40, 'star');
  if (k === 'bomb') {
    G.boom = {x:h.x, y:h.y, t:0}; const k0 = P.kills;
    for (const s of G.world.snakes) {
      if (!s.alive || s.me) continue;
      const q = s.pts[0], d = Math.hypot(q.x - h.x, q.y - h.y);
      if (d < 340) { if (s.boss) cutSnake(s, Math.max(5, Math.floor(s.pts.length*.5)), P); else killSnake(s, P); }
      else { // bodies inside the blast lose everything past the first segment that was hit
        for (let i = 4; i < s.pts.length; i += 2) { const b = s.pts[i]; if (Math.hypot(b.x - h.x, b.y - h.y) < 300) { cutSnake(s, i, P); break; } }

    const nk = P.kills - k0; if (nk >= 1) Clip.mark(nk >= 2 ? 4 : 3, nk >= 2 ? t('clipBomb', {n:nk}) : t('pw_bomb'));
    return;

  if (k === 'rainbow') Clip.mark(2, cleanName(t('pwn_rainbow')));

  chainKey = ''; drawChain();
}
const powerOn = k => G.power && G.power.k === k && G.time < G.power.until;

/* cut a snake at segment idx; the cut part bursts into glowing orbs */
function cutSnake(s, idx, by){
  if (!s.alive) return;
  if (idx < 5) { if (s.me) hurtPlayer(s, by); else killSnake(s, by); return; }
  const removed = s.pts.splice(idx); if (!removed.length) return;
  for (let i = 0; i < removed.length; i += 2) { const q = removed[i]; addFood('orb', q.x + (R()-.5)*s.r, q.y + (R()-.5)*s.r, {col:s.sk.A, val:.14, r:11, exp:G.time + 30}); }
  s.mass = Math.max(2.5, (idx - 8)/1.9);
  const c0 = removed[0]; burst(c0.x, c0.y, s.sk.A, 18, 'star');
  if (by && by.me) {
    const pts = 40 + removed.length*4; addScore(pts); G.bites = (G.bites||0) + 1; qAdd('bite', 1);
    floats.push({x:c0.x, y:c0.y, txt:'+' + Math.round(pts*scoreMul()), life:1.2, col:'#ff9a3a', big:true});
    feed(t('bite'), '#ff9a3a'); Snd.play('bite'); buzz([25,15,25]); G.shake = Math.max(G.shake, 7);
  }
  if (s.me) { feed(t('bitten'), '#ff6b78'); Snd.play('warn'); buzz([50,30,50]); G.shake = Math.max(G.shake, 9); G.flash = .25; G.flashCol = COL.danger; }
}

/* collision between a head and a body segment: front of the body kills, tail end gets bitten off */
function bodyHit(s, it){
  const o = it.s, len = o.pts.length, tailZone = it.i >= Math.floor(len*.62);
  if (frozen(o)) { if (it.i < 5) killSnake(o, s); else cutSnake(o, it.i, s); return 'bite'; }
  if (s.me && powerOn('giant')) { if (o.boss && it.i < 6) return 'die'; cutSnake(o, Math.max(it.i, 5), s); return 'bite'; }
  if (tailZone && it.i > 4) { cutSnake(o, it.i, s); return 'bite'; }
  return 'die';
}

/* fire trail: the player's tail leaves flames that take out rivals who touch them */
function powersUpdate(dt){
  const P = G.player; if (!P || !P.alive) return;
  G.fire = G.fire || [];
  if (powerOn('fire')) {
    G.fireT = (G.fireT||0) - dt;
    if (G.fireT < 0) { G.fireT = .07; const tl = P.pts[P.pts.length - 1], mid = P.pts[Math.floor(P.pts.length*.6)]; G.fire.push({x:tl.x, y:tl.y, life:2.4}, {x:mid.x, y:mid.y, life:1.6}); }
  }
  for (const f of G.fire) f.life -= dt;
  compact(G.fire, f => f.life > 0);
  if (G.fire.length) for (const s of G.world.snakes) {
    if (!s.alive || s.me) continue;
    const h = s.pts[0];
    for (const f of G.fire) { const dx = f.x - h.x, dy = f.y - h.y; if (dx*dx + dy*dy < (s.r + 16)*(s.r + 16)) { if (s.boss) { cutSnake(s, Math.max(6, s.pts.length - 6), P); f.life = 0; } else killSnake(s, P); break; } }
  }

  // evolution tiers during the run
  const L = dispLen(P), tier = TIERS.reduce((a, [n], i) => L >= n ? i + 1 : a, 0);
  if (tier > (G.tier||0)) { G.tier = tier; feed(t('tier', {n:t('tier'+tier)}), TIERS[tier-1][1]); Snd.play('win'); buzz([20,20,40]); burst(P.pts[0].x, P.pts[0].y, TIERS[tier-1][1], 40, 'star'); }
  if (G.power && G.time > G.power.until) { G.power = null; drawChain(); }
}

/* ================= First-run tutorial: learn by doing, one step at a time ================= */

function tutTick(dt){

/* a guide arrow from the player toward what the current step needs */
function tutArrow(c, tm){

const pointInPoly = (x, y, poly) => { let ins = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const a = poly[i], b = poly[j]; if ((a.y > y) !== (b.y > y) && x < (b.x - a.x)*(y - a.y)/(b.y - a.y) + a.x) ins = !ins; } return ins; };
const polyArea = poly => { let s = 0; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) s += (poly[j].x + poly[i].x)*(poly[j].y - poly[i].y); return Math.abs(s/2); };

/* LASSO: close a loop with your own body and swallow everything inside it */
function lassoCheck(){
  const P = G.player; if (!P || !P.alive || G.time < (G.lassoCD||0)) return;
  const p = P.pts, h = p[0]; if (p.length < 26) return;
  for (let i = 20; i < p.length; i += 2) {
    const q = p[i], dx = q.x - h.x, dy = q.y - h.y;
    if (dx*dx + dy*dy < (P.r*1.15)*(P.r*1.15)) {
      const poly = p.slice(0, i + 1).map(o => ({x:o.x, y:o.y}));
      if (polyArea(poly) < 6000) return;
      captureLoop(poly); G.lassoCD = G.time + 1.2; return;
    }
  }
}
function captureLoop(poly){
  const P = G.player; let minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
  for (const o of poly) { minx = Math.min(minx, o.x); maxx = Math.max(maxx, o.x); miny = Math.min(miny, o.y); maxy = Math.max(maxy, o.y); }
  let n = 0, ns = 0;
  for (const f of G.world.foods) if (!f.dead && f.x > minx && f.x < maxx && f.y > miny && f.y < maxy && pointInPoly(f.x, f.y, poly)) { eat(P, f); n++; }
  for (const s of G.world.snakes) {
    if (!s.alive || s.me) continue;
    const q = s.pts[0];
    if (q.x > minx && q.x < maxx && q.y > miny && q.y < maxy && pointInPoly(q.x, q.y, poly)) { if (s.boss) cutSnake(s, Math.max(6, Math.floor(s.pts.length*.5)), P); else killSnake(s, P); n += 5; ns++; }
  }
  if (!n) return;
  const bonus = 60 + n*25; addScore(bonus);
  const c = poly.reduce((a, o) => ({x:a.x + o.x/poly.length, y:a.y + o.y/poly.length}), {x:0, y:0});
  floats.push({x:c.x, y:c.y, txt:'+' + Math.round(bonus*scoreMul()), life:1.6, col:'#3ee6d0', big:true});
  G.lassoFx = {poly, t:0, col:P.sk.A};
  explainOnce('lasso'); feed(t('lassoN', {n}), '#3ee6d0'); Snd.play('power'); buzz([30,30,60]); G.shake = Math.max(G.shake, 10); G.slowmo = Math.max(G.slowmo||0, .35);
  qAdd('loop', 1);
  if (ns >= 1) Clip.mark(ns >= 2 ? 4 : 3, t('lassoN', {n}));
}

/* RUNAWAY FRUIT: golden fruit that hops away from you; catch it for gold and a colour wildcard */
function runnersUpdate(dt){
  const w = G.world, P = G.player;
  if ((save.stats.games||0) >= 1 && G.mode !== 'adventure') {
    let n = 0; for (const f of w.foods) if (f.type === 'runner' && !f.dead) n++;

    if (P && P.alive) { const dx = f.x - P.pts[0].x, dy = f.y - P.pts[0].y, d = Math.hypot(dx, dy); if (d < 380) { const k = 420*(1 - d/380) + 120; ax += dx/d*k; ay += dy/d*k; if (!f.seen) { f.seen = true; } } }
    f.vx = (f.vx + ax*dt)*.92; f.vy = (f.vy + ay*dt)*.92;
    const sp = Math.hypot(f.vx, f.vy), mx = 195; if (sp > mx) { f.vx *= mx/sp; f.vy *= mx/sp; }
    f.x += f.vx*dt*3.2; f.y += f.vy*dt*3.2;

    if (Q().detail && R() < .3) parts.push({x:f.x + (R() - .5)*16, y:f.y + 14, vx:(R() - .5)*20, vy:-10, life:.5, col:'#fff6b0', r:2 + R()*2, kind:'star', rot:R()*6});

/* BLACK HOLE: a world event; pulls everything in, the core is deadly, the ring is full of loot */
function holeUpdate(dt){
  const w = G.world, P = G.player;
  if (!G.hole && G.mode === 'classic' && (save.stats.games||0) >= 3 && G.time > (G.nextHole || 75) && !G.tut) {
    const sp = freeSpot(800, 500); G.hole = {x:sp.x, y:sp.y, t:0, life:28};
    for (let i = 0; i < 46; i++) { const a = R()*TAU, d = 150 + R()*170; addFood(i % 5 ? 'orb' : 'fruit', sp.x + Math.cos(a)*d, sp.y + Math.sin(a)*d, {col:['#b07aff','#5ab8ff','#ff5ad0'][i % 3], val:.12, r:11}); }
    if (!explainOnce('hole')) feed(t('hole'), '#b07aff'); Snd.play('warn'); buzz([40,30,40]);
  }
  const H = G.hole; if (!H) return;
  H.t += dt;
  const grow = Math.min(1, H.t/1.5)*(H.t > H.life - 1.5 ? Math.max(0, (H.life - H.t)/1.5) : 1), core = 70*grow, pull = 520*grow;
  for (const f of w.foods) { if (f.dead || f.type === 'runner') continue; const dx = H.x - f.x, dy = H.y - f.y, d = Math.hypot(dx, dy); if (d < pull && d > 130) { const k = dt*60*(1 - d/pull); f.x += dx/d*k - dy/d*k*.8; f.y += dy/d*k + dx/d*k*.8; } }
  for (const s of w.snakes) {
    if (!s.alive) continue;
    const h = s.pts[0], dx = H.x - h.x, dy = H.y - h.y, d = Math.hypot(dx, dy);
    if (d < pull) { const k = dt*(s.me ? 70 : 50)*(1 - d/pull); h.x += dx/d*k; h.y += dy/d*k; }
    if (d < core + s.r*.4) { if (s.me) { if (G.time > G.ghostUntil) hurtPlayer(s, null); } else killSnake(s, null); }
  }
  if (H.t >= H.life) {
    for (let i = 0; i < 24; i++) { const a = R()*TAU, d = 60 + R()*220; addFood('orb', H.x + Math.cos(a)*d, H.y + Math.sin(a)*d, {col:'#b07aff', val:.15, r:12, exp:G.time + 30}); }
    burst(H.x, H.y, '#b07aff', 50, 'star'); Snd.play('boom'); G.hole = null; G.nextHole = G.time + 70 + R()*30;
  }
}

/* ================= Input: drag-to-steer, joystick, D-pad, keyboard, boost ================= */
const input = {ang:null, boost:false, keys:{}, mouse:null, mBoost:false};

  const k = input.keys; let kx = (k.ArrowRight||k.KeyD?1:0) - (k.ArrowLeft||k.KeyA?1:0), ky = (k.ArrowDown||k.KeyS?1:0) - (k.ArrowUp||k.KeyW?1:0);

    const h = P.pts[0], mx = input.mouse.x - ((h.x - cam.x)*cam.z + VW/2), my = input.mouse.y - ((h.y - cam.y)*cam.z + VH/2);
    if (mx*mx + my*my > 144) input.ang = Math.atan2(my, mx);

  P.boost = input.boost || input.mBoost || !!k.Space || !!k.ShiftLeft || !!k.ShiftRight;

}

function steerPtr(){ for (const [id, p] of ptrs) if (p.steer) return p; return null; }
cv.addEventListener('pointerdown', e => {

  if (steerPtr()) { ptrs.set(e.pointerId, {boost:true}); input.boost = true; return; }   // second finger = boost

  }

    case 'bubble':  p.y = anywhere ? R()*bh : bh+10; p.vy = -(20+R()*30); p.r = 2+R()*4; p.col = '#ffffff'; break;
    case 'sprinkle':p.vy = 22+R()*20; p.vx = (R()-.5)*6; p.r = 2.5; p.col = ['#ff5a8a','#ffd24a','#5ad6ff','#7aff9a','#ffffff'][(R()*5)|0]; break;

  if (pm.acc < .5) return;
  if (!pm.el) { pm.el = document.createElement('div'); pm.el.id = 'perfMon'; document.body.appendChild(pm.el); }
  pm.el.hidden = false;
  pm.el.textContent = `${Math.round(pm.n/pm.acc)} FPS · lógica ${(pm.up/pm.n).toFixed(1)} ms · dibujo ${(pm.dr/pm.n).toFixed(1)} ms · peor ${pm.worst.toFixed(0)} ms · tirones ${pm.long} · ${cv.width}×${cv.height}`;
  pm.n = 0; pm.acc = 0; pm.up = 0; pm.dr = 0; pm.worst = 0; pm.long = 0;
}
