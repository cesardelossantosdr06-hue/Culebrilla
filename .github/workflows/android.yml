name: Culebrilla Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor and copy the game into the app
        working-directory: app
        run: |
          npm ci
          npm run sync

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/apk/release/app-release.apk Culebrilla.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk Culebrilla.apk \
            --title "Culebrilla para Android (APK de prueba)" \
            --notes "Descarga Culebrilla.apk e instálala en tu Android. Versión de prueba para compartir con amigos antes de Google Play." \
            --latest
